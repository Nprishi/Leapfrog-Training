<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Promo Widgets</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="promo-ui">

        <h2>New Launch</h2>

        <button class="promo-btn">
            Explore Offer
        </button>

        <article class="promo-card">

            <h3>Special Student Discount</h3>

            <p>
                Hover over this card to experience smooth animation,
                scaling, shadow effects, and interactive UI feedback.
            </p>

        </article>

        <div class="promo-loader" aria-label="Loading"></div>

    </section>

</body>

</html>
